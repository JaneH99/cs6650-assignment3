name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Compile all modules and run tests
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B clean package

  # Build the Docker images and check the full stack starts
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Start stack with docker compose
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Check health endpoints
        run: |
          for url in http://localhost:8080/health http://localhost:8081/health; do
            for i in $(seq 1 30); do
              if curl -sf "$url"; then echo; break; fi
              if [ "$i" -eq 30 ]; then echo "$url did not become healthy"; exit 1; fi
              sleep 2
            done
          done

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: docker compose down -v
