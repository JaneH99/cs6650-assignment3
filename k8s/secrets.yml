apiVersion: v1
kind: Secret
metadata:
  name: chat-secrets
type: Opaque
stringData:
  rabbitmq-host: "<RABBITMQ_HOST>"         # e.g. your EC2 private IP or Amazon MQ endpoint
  redis-host: "<REDIS_HOST>"               # e.g. ElastiCache endpoint
  postgres-url: "jdbc:postgresql://<RDS_HOST>:5432/chatdb"
  postgres-username: "postgres"
  postgres-password: "<YOUR_PASSWORD>"
